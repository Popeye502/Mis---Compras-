<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0f05">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b1a'/%3E%3Cstop offset='1' stop-color='%2322c55e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%231a0f05'/%3E%3Cpath d='M30 38h6l6 22h34l5-18H42' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='46' cy='72' r='6' fill='%23ff6b1a'/%3E%3Ccircle cx='72' cy='72' r='6' fill='%2322c55e'/%3E%3C/svg%3E">
    <title>Mis Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --super-naranja: #ff6b1a;
            --super-naranja-osc: #cc4a00;
            --super-naranja-soft: rgba(255, 107, 26, 0.14);
            --super-verde: #22c55e;
            --super-verde-osc: #15803d;
            --super-verde-soft: rgba(34, 197, 94, 0.14);
            --super-amarillo: #fbbf24;
            --super-rojo: #ef4444;
            --super-rojo-soft: rgba(239, 68, 68, 0.1);
            --bg-card: rgba(25, 15, 5, 0.72);
            --bg-card-solid: #1a0f08;
            --bg-card-solid-2: #24160a;
            --text: #ffffff;
            --muted: #c9b89a;
            --overlay: rgba(10, 5, 0, 0.78);
            --border: rgba(255, 107, 26, 0.18);
            --border-light: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { font-family: 'Quicksand', sans-serif; margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
        html { height: 100%; font-size: 16px; }
        body {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(255, 107, 26, 0.18), transparent 55%),
                radial-gradient(ellipse at 80% 100%, rgba(34, 197, 94, 0.15), transparent 55%),
                linear-gradient(135deg, rgba(20, 10, 0, 0.82), rgba(5, 15, 5, 0.88)),
                url('https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/67eb7796b4414f36b924c8a39fce6080.jpeg~tplv-0es2k971ck-image.image?rcl=202609170313438F2D46A90BE1455AE9E5&rk3s=8e244e95&rrcfp=02a80fc2&x-expires=1792178080&x-signature=fEg%2BUvXaPzfXMYuCd0AoOCUQ%2Bks%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            padding: calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow-x: hidden;
            touch-action: manipulation;
        }
        button { -webkit-touch-callout: none; user-select: none; touch-action: manipulation; }
        input { user-select: text; }

        /* SVG ICONS BASE */
        .icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
        .icon-lg { width: 24px; height: 24px; }
        .icon-xl { width: 32px; height: 32px; }

        /* PANTALLA DE CARGA */
        .pantalla-carga {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 30% 30%, rgba(255,107,26,0.22), transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(34,197,94,0.18), transparent 50%),
                linear-gradient(135deg, #1a0a00 0%, #0a1a0a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow: hidden; padding: var(--safe-top) 0 var(--safe-bottom);
        }
        .pantalla-carga.oculta { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .carga-hero {
            position: relative; width: 140px; height: 140px;
            margin-bottom: 22px;
            display: flex; align-items: center; justify-content: center;
        }
        .carga-hero::before {
            content: ''; position: absolute; inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, 
                transparent, var(--super-naranja), 
                var(--super-amarillo), var(--super-verde), transparent);
            animation: girar 2s linear infinite;
            filter: blur(6px); opacity: 0.7;
        }
        .carga-hero::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--super-naranja);
            border-right-color: var(--super-amarillo);
            border-bottom-color: var(--super-verde);
            animation: girar 1.2s linear infinite reverse;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        
        .carga-icono {
            z-index: 1; color: var(--super-naranja);
            animation: pulso 1s ease-in-out infinite;
            filter: drop-shadow(0 0 12px var(--super-naranja));
        }
        .carga-icono svg { width: 56px; height: 56px; stroke-width: 1.8; }
        @keyframes pulso {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .carga-texto {
            font-family: 'Quicksand', sans-serif;
            font-size: 32px; font-weight: 700;
            background: linear-gradient(90deg, 
                var(--super-naranja), var(--super-amarillo), 
                var(--super-verde), var(--super-naranja));
            background-size: 300% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: transparent;
            animation: arcoiris 2.5s linear infinite;
            margin-bottom: 18px; letter-spacing: 3px;
        }
        @keyframes arcoiris { to { background-position: 300% center; } }
        
        .carga-sub {
            color: var(--muted); font-size: 12px; margin-bottom: 16px;
            letter-spacing: 4px; text-transform: uppercase; font-weight: 600;
        }
        
        .carga-barra {
            width: 200px; height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255,107,26,0.2);
        }
        .carga-progreso {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--super-naranja), var(--super-amarillo), var(--super-verde));
            border-radius: 10px;
            box-shadow: 0 0 12px var(--super-naranja);
        }
        .carga-progreso.lenta { animation: cargarLenta 2s ease forwards; }
        .carga-progreso.rapida { animation: cargarRapida 0.45s ease forwards; }
        @keyframes cargarLenta { to { width: 100%; } }
        @keyframes cargarRapida { to { width: 100%; } }

        /* BOTÓN COMENZAR */
        .carga-btn {
            margin-top: 22px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--super-naranja), var(--super-naranja-osc));
            color: white; border: none; border-radius: 50px;
            font-family: 'Quicksand', sans-serif; font-size: 16px; font-weight: 700;
            letter-spacing: 1.5px; cursor: pointer;
            box-shadow: 0 0 24px rgba(255,107,26,0.6), 0 4px 16px rgba(0,0,0,0.3);
            opacity: 0; transform: translateY(15px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            display: inline-flex; align-items: center; gap: 10px;
            min-height: 50px;
        }
        .carga-btn.visible {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
            animation: botonRespirar 2s ease-in-out infinite;
        }
        .carga-btn:active { transform: scale(0.94); box-shadow: 0 0 36px rgba(255,107,26,0.9); }
        .carga-btn svg { width: 20px; height: 20px; }
        @keyframes botonRespirar {
            0%, 100% { box-shadow: 0 0 24px rgba(255,107,26,0.6), 0 4px 16px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 38px rgba(255,107,26,0.85), 0 4px 20px rgba(0,0,0,0.35); }
        }
        .pantalla-carga.lista-para-empezar { cursor: pointer; }

        /* NOTIFICACIÓN INSTALAR */
        .install-prompt {
            position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%) translateY(140px);
            width: 92%; max-width: 440px;
            background: var(--bg-card-solid);
            border: 1px solid var(--super-naranja);
            border-radius: 16px; padding: 14px 40px 14px 16px;
            box-shadow: 0 0 24px rgba(255,107,26,0.35), 0 12px 32px rgba(0,0,0,0.5);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            z-index: 9998; display: flex; align-items: center; gap: 10px;
            opacity: 0; visibility: hidden; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .install-prompt.mostrar {
            opacity: 1; visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .install-icon { color: var(--super-naranja); display: flex; }
        .install-text { flex: 1; }
        .install-text strong { display: block; color: white; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
        .install-text small { color: var(--muted); font-size: 12px; font-weight: 500; }
        .install-btn {
            background: linear-gradient(135deg, var(--super-naranja), var(--super-naranja-osc));
            color: white; border: none; border-radius: 10px;
            padding: 10px 18px; font-size: 14px; font-weight: 700;
            cursor: pointer; box-shadow: 0 0 14px rgba(255,107,26,0.5);
            min-height: 40px; letter-spacing: 0.02em;
        }
        .install-btn:active { transform: scale(0.95); }
        .install-close {
            position: absolute; top: 4px; right: 6px; background: none; border: none;
            color: var(--muted); cursor: pointer; padding: 8px; display: flex;
            min-width: 36px; min-height: 36px; align-items: center; justify-content: center;
        }

        /* CONTENEDOR */
        .max-w-lg { width: 100%; max-width: 440px; margin: 0 auto; }
        .glass-card {
            background: var(--bg-card);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px; padding: 28px 22px; margin-bottom: 18px;
            box-shadow: 
                0 0 30px rgba(255,107,26,0.12), 
                0 20px 48px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--super-naranja), var(--super-verde), transparent);
            opacity: 0.6;
        }
        .text-center { text-align: center; }
        h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 38px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #ffe8d0 40%, var(--super-amarillo) 70%, var(--super-naranja) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0 var(--super-naranja-osc)) drop-shadow(0 0 14px rgba(255,107,26,0.45));
            letter-spacing: 2px; display: inline-flex; align-items: center; gap: 12px;
            line-height: 1.1;
        }
        h1 .title-icon {
            color: var(--super-verde);
            filter: drop-shadow(0 0 10px rgba(34,197,94,0.7));
            animation: carrito 2s ease-in-out infinite;
        }
        h1 .title-icon svg { width: 34px; height: 34px; stroke-width: 2; }
        @keyframes carrito {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-4px) rotate(-4deg); }
            75% { transform: translateX(4px) rotate(4deg); }
        }
        .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 24px; font-weight: 500; letter-spacing: 0.01em; }
        .subtitle span { color: var(--super-amarillo); font-weight: 700; }

        /* PROGRESO CIRCULAR + STATS */
        .progreso-wrap {
            display: flex; align-items: center; justify-content: center; gap: 18px;
            margin-bottom: 8px;
        }
        .anillo-progreso {
            position: relative; width: 96px; height: 96px; flex-shrink: 0;
        }
        .anillo-progreso svg { width: 96px; height: 96px; transform: rotate(-90deg); }
        .anillo-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 7; }
        .anillo-fill {
            fill: none; stroke-width: 7; stroke-linecap: round;
            stroke: url(#gradiente-anillo);
            stroke-dasharray: 264; stroke-dashoffset: 264;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 4px rgba(255,107,26,0.5));
        }
        .anillo-texto {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .anillo-pct {
            font-family: 'Quicksand', sans-serif;
            font-size: 24px; font-weight: 700; color: white; line-height: 1;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }
        .anillo-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-top: 3px; }

        .stats-col { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .stat-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-light);
            border-radius: 14px; padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.2s ease;
        }
        .stat-pill.done { border-color: rgba(34,197,94,0.3); background: var(--super-verde-soft); }
        .stat-pill.pending { border-color: rgba(255,107,26,0.3); background: var(--super-naranja-soft); }
        .stat-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .stat-pill.done .stat-icon { background: rgba(34,197,94,0.2); color: var(--super-verde); }
        .stat-pill.pending .stat-icon { background: rgba(255,107,26,0.2); color: var(--super-naranja); }
        .stat-info { flex: 1; min-width: 0; }
        .stat-num {
            font-family: 'Quicksand', sans-serif;
            font-size: 26px; font-weight: 700; line-height: 1;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        .stat-pill.done .stat-num { color: var(--super-verde); text-shadow: 0 0 10px rgba(34,197,94,0.45); }
        .stat-pill.pending .stat-num { color: var(--super-naranja); text-shadow: 0 0 10px rgba(255,107,26,0.45); }
        .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: 3px; }
        .stat-bump { animation: bump 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

        /* INPUT */
        .input-wrapper { display: flex; gap: 10px; margin-top: 22px; }
        .input-field {
            flex: 1; padding: 15px 16px; border-radius: 14px;
            border: 2px solid rgba(255,107,26,0.18);
            background: rgba(255,255,255,0.06); color: white; font-size: 16px; font-weight: 500;
            transition: all 0.2s ease; min-height: 52px;
            letter-spacing: 0.01em;
        }
        .input-field::placeholder { color: rgba(201,184,154,0.45); font-weight: 500; }
        .input-field:focus {
            outline: none; border-color: var(--super-naranja);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(255,107,26,0.15), 0 0 18px rgba(255,107,26,0.25);
        }
        .btn-add {
            padding: 0 20px; min-width: 54px; min-height: 50px;
            background: linear-gradient(135deg, var(--super-naranja), var(--super-naranja-osc));
            color: white; border: none; border-radius: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,107,26,0.5);
            transition: all 0.15s ease;
        }
        .btn-add:active { transform: scale(0.94); box-shadow: 0 0 30px rgba(255,107,26,0.85); }
        .btn-add svg { width: 24px; height: 24px; stroke-width: 2.5; }

        /* BOTONES PRINCIPALES */
        .botones-fila { display: flex; gap: 12px; }
        .btn-abrir {
            flex: 1; padding: 16px 12px; border: none; border-radius: 16px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.15s ease; display: flex;
            align-items: center; justify-content: center; gap: 8px; color: white;
            min-height: 56px; letter-spacing: 0.03em;
            font-family: 'Quicksand', sans-serif;
        }
        .btn-abrir svg { width: 18px; height: 18px; }
        .btn-abrir.pendientes {
            background: linear-gradient(135deg, #ff8c3a, var(--super-naranja));
            box-shadow: 0 0 22px rgba(255,107,26,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid rgba(255,107,26,0.5);
        }
        .btn-abrir.pendientes:active { transform: scale(0.96); box-shadow: 0 0 32px rgba(255,107,26,0.85); }
        .btn-abrir.comprados {
            background: linear-gradient(135deg, #4ade80, var(--super-verde));
            color: #052e16;
            box-shadow: 0 0 22px rgba(34,197,94,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            border: 1px solid rgba(34,197,94,0.5);
        }
        .btn-abrir.comprados:active { transform: scale(0.96); box-shadow: 0 0 32px rgba(34,197,94,0.85); }

        /* VENTANAS */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: 100; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }
        .overlay.activo { opacity: 1; visibility: visible; }
        .ventana {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -45%) scale(0.92);
            width: 92%; max-width: 440px; max-height: 82dvh;
            background: var(--bg-card-solid); border-radius: 22px;
            z-index: 101; opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: hidden;
            display: flex; flex-direction: column;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
        }
        .ventana.activo { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .ventana.pendientes {
            border: 1px solid rgba(255,107,26,0.4);
            box-shadow: 0 0 40px rgba(255,107,26,0.4), 0 24px 60px rgba(0,0,0,0.6);
        }
        .ventana.comprados {
            border: 1px solid rgba(34,197,94,0.4);
            box-shadow: 0 0 40px rgba(34,197,94,0.4), 0 24px 60px rgba(0,0,0,0.6);
        }
        .ventana-header {
            padding: 16px 18px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .ventana.pendientes .ventana-header { background: linear-gradient(135deg, rgba(255,107,26,0.12), transparent); }
        .ventana.comprados .ventana-header { background: linear-gradient(135deg, rgba(34,197,94,0.12), transparent); }
        .ventana-titulo {
            font-family: 'Quicksand', sans-serif;
            font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px;
            letter-spacing: 0.02em;
        }
        .ventana-titulo .tit-icon { display: flex; }
        .ventana.pendientes .ventana-titulo { color: var(--super-naranja); text-shadow: 0 0 10px rgba(255,107,26,0.45); }
        .ventana.comprados .ventana-titulo { color: var(--super-verde); text-shadow: 0 0 10px rgba(34,197,94,0.45); }
        .ventana-contador { padding: 5px 13px; border-radius: 20px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
        .ventana.pendientes .ventana-contador {
            background: var(--super-naranja-soft); color: var(--super-naranja);
            border: 1px solid rgba(255,107,26,0.35);
        }
        .ventana.comprados .ventana-contador {
            background: var(--super-verde-soft); color: var(--super-verde);
            border: 1px solid rgba(34,197,94,0.35);
        }
        .btn-cerrar {
            width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid var(--border-light);
            background: rgba(255,255,255,0.06); color: var(--muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease; flex-shrink: 0;
        }
        .btn-cerrar:active { background: rgba(255,107,26,0.2); color: white; transform: scale(0.9); border-color: var(--super-naranja); }
        .btn-cerrar svg { width: 18px; height: 18px; }
        .ventana-body { padding: 14px 16px 16px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

        /* ITEMS */

            transition: background 0.15s ease, border-color 0.15s ease;

        @keyframes entrada { to { opacity: 1; transform: translateY(0) scale(1); } }
        li:hover, li:active { border-left-color: var(--super-naranja); background: var(--super-naranja-soft); }
        li.removing { animation: salida 0.28s ease forwards; }

        .btn-del:active { background: var(--super-rojo); color: white; transform: scale(0.88); box-shadow: 0 0 14px var(--super-rojo); }
        .btn-check svg, .btn-uncheck svg, .btn-del svg { width: 18px; height: 18px; }
        .empty-state {
            text-align: center; padding: 40px 16px; color: var(--muted);

        .btn-clear svg { width: 16px; height: 16px; }

        /* DIÁLOGO CONFIRMACIÓN */
        .confirm-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.2s ease;
            padding: 20px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        }
        .confirm-overlay.activo { opacity: 1; visibility: visible; }
        .confirm-box {
            background: var(--bg-card-solid-2); border: 1px solid rgba(255,107,26,0.3);
            border-radius: 20px; padding: 24px; width: 100%; max-width: 320px;

        }
        .confirm-overlay.activo .confirm-box { transform: scale(1); }
        .confirm-icon {
            width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 14px;
            background: var(--super-rojo-soft); display: flex; align-items: center;
            justify-content: center; color: var(--super-rojo);
        }
        .confirm-icon svg { width: 28px; height: 28px; }
        .confirm-titulo { font-family: 'Quicksand', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.01em; }
        .confirm-msg { color: var(--muted); font-size: 15px; margin-bottom: 22px; line-height: 1.45; font-weight: 500; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btn {
            flex: 1; padding: 13px; border-radius: 12px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; min-height: 46px;
            transition: all 0.12s ease; letter-spacing: 0.02em;
        }
        .confirm-btn.cancel { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border-light); }
        .confirm-btn.cancel:active { background: rgba(255,255,255,0.12); transform: scale(0.96); }
        .confirm-btn.danger { background: linear-gradient(135deg, var(--super-rojo), #c02626); color: white; box-shadow: 0 0 14px rgba(239,68,68,0.4); }
        .confirm-btn.danger:active { transform: scale(0.96); box-shadow: 0 0 22px rgba(239,68,68,0.7); }

        /* TOAST */
        .toast {
            position: fixed; top: calc(20px + var(--safe-top)); left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card-solid-2); border: 1px solid var(--super-verde);
            color: white; padding: 13px 22px; border-radius: 14px;
            font-size: 15px; font-weight: 600; z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 18px rgba(34,197,94,0.3);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0; display: flex; align-items: center; gap: 10px;
            letter-spacing: 0.01em;
        }
        .toast.mostrar { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast svg { width: 18px; height: 18px; color: var(--super-verde); flex-shrink: 0; }

        /* CÉLEBRACIÓN */
        .celebrar { animation: celebrar 0.6s ease; }
        @keyframes celebrar {
            0% { transform: scale(1); }
            25% { transform: scale(1.06) rotate(-1deg); }
            50% { transform: scale(1.08) rotate(1deg); }
            75% { transform: scale(1.04) rotate(-0.5deg); }
            100% { transform: scale(1); }
        }

        /* RESPONSIVE */
        @media (max-width: 360px) {
            html { font-size: 15px; }

            h1 .title-icon svg { width: 28px; height: 28px; }

            .item-text { font-size: 15px; }
        }
        @media (min-height: 780px) {
            .glass-card { padding: 32px 24px; }
        }
    </style>
</head>

    <script>
    (function() {
        'use strict';

        // ========== AUDIO ==========
        var AC = null;
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { AC = null; }
        var VOL = 0.5;
        var fanfarriaYaSonó = false;

        function activarAudio() {
            if (AC && AC.state === 'suspended') {
                try { AC.resume(); } catch(e) {}
            }
        }
        document.addEventListener('touchstart', activarAudio, { passive: true, once: true });
        document.addEventListener('click', activarAudio, { once: true });

        // Truco: intentar desbloquear audio con un sonido inaudible al cargar
        function desbloquearAudioSilencio() {
            if (!AC || AC.state === 'running') return;
            try {
                AC.resume().then(function() {
                    // Reproducir un sonido casi inaudible para "activar" el contexto
                    var o = AC.createOscillator();
                    var g = AC.createGain();
                    o.connect(g); g.connect(AC.destination);
                    o.frequency.value = 1000;
                    g.gain.value = 0.0001; // Casi silencioso
                    o.start();
                    o.stop(AC.currentTime + 0.01);
                }).catch(function() {});
            } catch(e) {}
        }

        function tocarNota(freq, inicio, duracion, tipo, vol) {
            if (!AC) return;
            try {
                var o = AC.createOscillator();
                var g = AC.createGain();
                o.connect(g); g.connect(AC.destination);
                o.type = tipo || 'triangle';
                var t = AC.currentTime + inicio;
                o.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(vol, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.001, t + duracion);
                o.start(t);
                o.stop(t + duracion + 0.02);
            } catch(e) {}
        }

        function fanfarriaEpica() {
            if (fanfarriaYaSonó) return;
            fanfarriaYaSonó = true;
            if (!AC) return;
            
            // INTENTO 1: Tocar inmediatamente (funciona si el navegador lo permite)
            var sonó = false;
            try {
                if (AC.state === 'running') {
                    _fanfarriaInterna();
                    sonó = true;
                } else if (AC.state === 'suspended') {
                    // Intentar desbloquear al cargar
                    AC.resume().then(function() {
                        if (AC.state === 'running') {
                            _fanfarriaInterna();
                            sonó = true;
                        }
                    }).catch(function() {});
                }
            } catch(e) {}
            
            // INTENTO 2: Si no sonó, sonar en el primer toque/tecla del usuario
            if (!sonó) {
                var tocarAlPrimerToque = function() {
                    activarAudio();
                    setTimeout(_fanfarriaInterna, 40);
                };
                document.addEventListener('touchstart', tocarAlPrimerToque, { passive: true, once: true });
                document.addEventListener('click', tocarAlPrimerToque, { once: true });
                document.addEventListener('keydown', tocarAlPrimerToque, { once: true });
            }
        }

        function _fanfarriaInterna() {
            var c = 0.13;
            tocarNota(261.63, 0,    0.17, 'triangle', VOL * 0.6);
            tocarNota(329.63, c,    0.17, 'triangle', VOL * 0.6);
            tocarNota(392.00, c*2,  0.17, 'triangle', VOL * 0.6);
            tocarNota(523.25, c*3,  0.19, 'triangle', VOL * 0.65);
            tocarNota(659.25, c*4,  0.19, 'triangle', VOL * 0.65);
            tocarNota(783.99, c*5,  0.21, 'triangle', VOL * 0.7);
            tocarNota(1046.50,c*6,  0.32, 'sine',     VOL * 0.75);
            tocarNota(130.81, c*7,  0.42, 'sine',     VOL * 0.85);
        }

        function sonido(t) {
            if (!AC) return;
            activarAudio();
            try {
                var o = AC.createOscillator(), g = AC.createGain();
                o.connect(g); g.connect(AC.destination);
                var x = AC.currentTime;
                switch(t) {
                    case 'agregar': 
                        o.type='triangle';
                        o.frequency.setValueAtTime(523,x); o.frequency.setValueAtTime(659,x+0.07); o.frequency.setValueAtTime(784,x+0.14);
                        g.gain.setValueAtTime(VOL,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.22);
                        o.start(x); o.stop(x+0.22); break;
                    case 'check': 
                        o.type='sine';
                        o.frequency.setValueAtTime(659,x); o.frequency.setValueAtTime(784,x+0.06); o.frequency.setValueAtTime(1047,x+0.12);
                        g.gain.setValueAtTime(VOL*0.85,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.22);
                        o.start(x); o.stop(x+0.22); break;
                    case 'uncheck': 
                        o.type='sine';
                        o.frequency.setValueAtTime(523,x); o.frequency.setValueAtTime(392,x+0.1);
                        g.gain.setValueAtTime(VOL*0.65,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.16);
                        o.start(x); o.stop(x+0.16); break;
                    case 'eliminar': 
                        o.type='sawtooth';
                        o.frequency.setValueAtTime(330,x); o.frequency.exponentialRampToValueAtTime(65,x+0.28);
                        g.gain.setValueAtTime(VOL*0.4,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.3);
                        o.start(x); o.stop(x+0.3); break;
                    case 'abrir': 
                        o.type='sine';
                        o.frequency.setValueAtTime(440,x); o.frequency.exponentialRampToValueAtTime(880,x+0.12);
                        g.gain.setValueAtTime(VOL*0.5,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.15);
                        o.start(x); o.stop(x+0.15); break;
                    case 'cerrar': 
                        o.type='sine';
                        o.frequency.setValueAtTime(660,x); o.frequency.exponentialRampToValueAtTime(220,x+0.18);
                        g.gain.setValueAtTime(VOL*0.4,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.2);
                        o.start(x); o.stop(x+0.2); break;
                    case 'completar':
                        o.type='sine';
                        o.frequency.setValueAtTime(523,x); o.frequency.setValueAtTime(659,x+0.08);
                        o.frequency.setValueAtTime(784,x+0.16); o.frequency.setValueAtTime(1047,x+0.24);
                        g.gain.setValueAtTime(VOL*0.7,x); g.gain.exponentialRampToValueAtTime(0.001,x+0.4);
                        o.start(x); o.stop(x+0.4); break;
                }
            } catch(e) {}
        }

        // Vibración háptica
        function vibrar(patron) {
            if (navigator.vibrate) {
                try { navigator.vibrate(patron); } catch(e) {}
            }
        }

        // ========== STORAGE ==========
        var STORAGE_KEY = 'listaCompras_v2';
        function cargarItems() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }
        function guardarItems(items) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); return true; }
            catch(e) { return false; }
        }
        function getStorageFlag(k) {
            try { return localStorage.getItem(k); } catch(e) { return null; }
        }
        function setStorageFlag(k, v) {
            try { localStorage.setItem(k, v); } catch(e) {}
        }

        // ========== ESTADO ==========
        var items = cargarItems();
        var confirmCallback = null;

        // ========== DOM CACHE ==========
        var $ = function(id) { return document.getElementById(id); };
        var el = {
            pantallaCarga: $('pantallaCarga'),
            cargaProgreso: $('cargaProgreso'),
            cargaSub: $('cargaSub'),
            cargaBtn: $('cargaBtn'),
            principal: $('principal'),
            installPrompt: $('installPrompt'),
            installClose: $('installClose'),
            btnInstalar: $('btnInstalar'),
            overlay: $('overlay'),
            ventPendientes: $('ventPendientes'),
            ventComprados: $('ventComprados'),
            cerrarPend: $('cerrarPend'),
            cerrarComp: $('cerrarComp'),
            listaPendientes: $('listaPendientes'),
            listaComprados: $('listaComprados'),
            contPend: $('contPend'),
            contComp: $('contComp'),
            statDone: $('statDone'),
            statPending: $('statPending'),
            nuevoItem: $('nuevoItem'),
            btnAdd: $('btnAdd'),
            btnVerPendientes: $('btnVerPendientes'),
            btnVerComprados: $('btnVerComprados'),
            btnLimpiar: $('btnLimpiar'),
            anilloFill: $('anilloFill'),
            pctText: $('pctText'),
            confirmOverlay: $('confirmOverlay'),
            confirmTitulo: $('confirmTitulo'),
            confirmMsg: $('confirmMsg'),
            confirmOk: $('confirmOk'),
            confirmCancel: $('confirmCancel'),
            toast: $('toast'),
            toastTexto: $('toastTexto')
        };

        // ========== VENTANAS ==========
        function abrirVent(n) {
            el.overlay.classList.add('activo');
            el['vent' + cap(n)].classList.add('activo');
            sonido('abrir');
            vibrar(10);
        }
        function cerrarVent(n) {
            el['vent' + cap(n)].classList.remove('activo');
            if (!document.querySelector('.ventana.activo')) el.overlay.classList.remove('activo');
            sonido('cerrar');
        }
        function cerrarTodas() {
            document.querySelectorAll('.ventana.activo').forEach(function(v) { v.classList.remove('activo'); });
            el.overlay.classList.remove('activo');
            sonido('cerrar');
        }
        function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        el.overlay.addEventListener('click', cerrarTodas);
        el.cerrarPend.addEventListener('click', function() { cerrarVent('pendientes'); });
        el.cerrarComp.addEventListener('click', function() { cerrarVent('comprados'); });
        el.btnVerPendientes.addEventListener('click', function() { abrirVent('pendientes'); });
        el.btnVerComprados.addEventListener('click', function() { abrirVent('comprados'); });

        // Cerrar con tecla Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (el.confirmOverlay.classList.contains('activo')) cerrarConfirm();
                else if (el.overlay.classList.contains('activo')) cerrarTodas();
            }
        });

        // ========== TOAST ==========
        var toastTimer = null;
        function mostrarToast(texto) {
            el.toastTexto.textContent = texto;
            el.toast.classList.add('mostrar');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.toast.classList.remove('mostrar'); }, 2200);
        }

        // ========== CONFIRMAR ==========
        function mostrarConfirm(titulo, msg, callback) {
            el.confirmTitulo.textContent = titulo;
            el.confirmMsg.textContent = msg;
            confirmCallback = callback;
            el.confirmOverlay.classList.add('activo');
        }
        function cerrarConfirm() {
            el.confirmOverlay.classList.remove('activo');
            confirmCallback = null;
        }
        el.confirmCancel.addEventListener('click', cerrarConfirm);
        el.confirmOk.addEventListener('click', function() {
            var cb = confirmCallback;
            cerrarConfirm();
            if (cb) cb();
        });
        el.confirmOverlay.addEventListener('click', function(e) {
            if (e.target === el.confirmOverlay) cerrarConfirm();
        });

        // ========== ACCIONES ITEMS ==========
        function agregar() {
            var t = el.nuevoItem.value.trim();
            if (!t) { el.nuevoItem.focus(); return; }
            items.push({ texto: t, hecho: false, id: Date.now() });
            guardarItems(items);
            el.nuevoItem.value = '';
            el.nuevoItem.focus();
            render();
            sonido('agregar');
            vibrar(15);
        }

        function marcar(id) {
            var it = items.find(function(i) { return i.id === id; });
            if (!it) return;
            it.hecho = !it.hecho;
            guardarItems(items);
            render();
            sonido(it.hecho ? 'check' : 'uncheck');
            vibrar(it.hecho ? [10, 20, 10] : 10);
            
            // ¿Completó todo?
            if (it.hecho && items.length > 0 && items.every(function(i) { return i.hecho; })) {
                setTimeout(function() {
                    sonido('completar');
                    vibrar([20, 40, 20, 40, 60]);
                    el.principal.classList.add('celebrar');
                    setTimeout(function() { el.principal.classList.remove('celebrar'); }, 600);
                    mostrarToast('¡Carrito completado!');
                }, 120);
            }
        }

        function eliminar(id) {
            var li = document.querySelector('li[data-id="' + id + '"]');
            if (li) li.classList.add('removing');
            sonido('eliminar');
            vibrar([15, 10, 15]);
            setTimeout(function() {
                items = items.filter(function(i) { return i.id !== id; });
                guardarItems(items);
                render();
            }, 280);
        }

        function limpiarComprados() {
            if (!items.some(function(i) { return i.hecho; })) return;
            mostrarConfirm(
                '¿Eliminar comprados?',
                'Se borrarán todos los productos marcados como comprados.',
                function() {
                    items = items.filter(function(i) { return !i.hecho; });
                    guardarItems(items);
                    render();
                    sonido('eliminar');
                    vibrar(30);
                    mostrarToast('Comprados eliminados');
                }
            );
        }

        el.btnAdd.addEventListener('click', agregar);
        el.nuevoItem.addEventListener('keypress', function(e) { if (e.key === 'Enter') agregar(); });
        el.btnLimpiar.addEventListener('click', limpiarComprados);

        // Event delegation en listas
        el.listaPendientes.addEventListener('click', manejarClickLista);
        el.listaComprados.addEventListener('click', manejarClickLista);

        function manejarClickLista(e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            var li = btn.closest('li');
            if (!li) return;
            var id = parseInt(li.getAttribute('data-id'), 10);
            if (isNaN(id)) return;
            
            if (btn.classList.contains('btn-check') || btn.classList.contains('btn-uncheck')) {
                marcar(id);
            } else if (btn.classList.contains('btn-del')) {
                eliminar(id);
            }
        }

        // ========== RENDER ==========
        function escaparHtml(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function crearBotonSVG(clase, pathD, ariaLabel) {
            var btn = document.createElement('button');
            btn.className = clase;
            btn.setAttribute('aria-label', ariaLabel);
            btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24">' + pathD + '</svg>';
            return btn;
        }

        function crearItem(it, esPendiente, idx) {
            var li = document.createElement('li');
            li.setAttribute('data-id', String(it.id));
            li.style.animationDelay = (idx * 35) + 'ms';
            if (!esPendiente) li.classList.add('done');

            var span = document.createElement('span');
            span.className = 'item-text';
            span.textContent = it.texto;

            var acciones = document.createElement('div');
            acciones.className = 'item-acciones';

            if (esPendiente) {
                acciones.appendChild(crearBotonSVG('btn-check', '<polyline points="20 6 9 17 4 12"/>', 'Marcar como comprado'));
            } else {
                acciones.appendChild(crearBotonSVG('btn-uncheck', '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>', 'Desmarcar'));
            }
            acciones.appendChild(crearBotonSVG('btn-del', '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 'Eliminar'));

            li.appendChild(span);
            li.appendChild(acciones);
            return li;
        }

        function crearEmptyState(iconPath, texto) {
            var li = document.createElement('li');
            li.className = 'empty-state';
            li.style.cssText = 'animation:none;background:transparent;border:none;';
            li.innerHTML = '<span class="empty-icon"><svg class="icon" viewBox="0 0 24 24">' + iconPath + '</svg></span><span>' + texto + '</span>';
            return li;
        }

        function render() {
            var fragPend = document.createDocumentFragment();
            var fragComp = document.createDocumentFragment();
            var pend = items.filter(function(i) { return !i.hecho; });
            var comp = items.filter(function(i) { return i.hecho; });

            if (pend.length === 0) {
                fragPend.appendChild(crearEmptyState(
                    '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
                    'Agrega productos a tu carrito'
                ));
            } else {
                pend.forEach(function(it, idx) { fragPend.appendChild(crearItem(it, true, idx)); });
            }

            if (comp.length === 0) {
                fragComp.appendChild(crearEmptyState(
                    '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>',
                    'Aún no has comprado nada'
                ));
            } else {
                comp.forEach(function(it, idx) { fragComp.appendChild(crearItem(it, false, idx)); });
            }

            el.listaPendientes.innerHTML = '';
            el.listaComprados.innerHTML = '';
            el.listaPendientes.appendChild(fragPend);
            el.listaComprados.appendChild(fragComp);

            actualizarStats(pend.length, comp.length);
        }

        function actualizarStats(pendCount, compCount) {
            var total = pendCount + compCount;
            var pct = total > 0 ? Math.round((compCount / total) * 100) : 0;
            var circunferencia = 264; // 2 * PI * 42
            var offset = circunferencia - (pct / 100) * circunferencia;

            el.anilloFill.style.strokeDashoffset = String(offset);
            el.pctText.textContent = pct + '%';

            var nums = [
                [el.statDone, compCount],
                [el.statPending, pendCount],
                [el.contPend, pendCount],
                [el.contComp, compCount]
            ];
            nums.forEach(function(par) {
                var elDom = par[0], val = par[1];
                if (elDom.textContent !== String(val)) {
                    elDom.textContent = val;
                    if (elDom.classList.contains('stat-num')) {
                        elDom.classList.remove('stat-bump');
                        void elDom.offsetWidth; // reflow
                        elDom.classList.add('stat-bump');
                    }
                }
            });
        }

        // ========== INSTALAR PWA ==========
        var defPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            defPrompt = e;
        });

        el.btnInstalar.addEventListener('click', async function() {
            if (defPrompt) {
                try {
                    defPrompt.prompt();
                    await defPrompt.userChoice;
                } catch(e) {}
                defPrompt = null;
                cerrarInstall();
            } else {
                mostrarToast('Toca los 3 puntitos → "Instalar app"');
            }
        });

        el.installClose.addEventListener('click', cerrarInstall);

        function cerrarInstall() {
            el.installPrompt.classList.remove('mostrar');
            setStorageFlag('installCerrada', '1');
        }

        function esStandalone() {
            try {
                return window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
            } catch(e) { return false; }
        }

        // ========== INICIO ==========
        function iniciarApp() {
            desbloquearAudioSilencio();
            
            var tieneLista = items.length > 0;
            var duracionCarga;
            
            if (tieneLista) {
                el.cargaProgreso.className = 'carga-progreso rapida';
                el.cargaSub.textContent = '¡Bienvenido de vuelta!';
                duracionCarga = 550;
            } else {
                el.cargaProgreso.className = 'carga-progreso lenta';
                el.cargaSub.textContent = 'Preparando tu carrito...';
                duracionCarga = 2050;
            }
            
            // Cuando termina la barra de carga, mostrar el botón
            setTimeout(mostrarBotonComenzar, duracionCarga);
        }

        function mostrarBotonComenzar() {
            el.cargaSub.textContent = 'Listo para comenzar';
            el.cargaBtn.style.display = 'inline-flex';
            
            // Forzar reflow antes de agregar la clase para que la animación funcione
            void el.cargaBtn.offsetWidth;
            el.cargaBtn.classList.add('visible');
            el.pantallaCarga.classList.add('lista-para-empezar');
            
            // Al tocar el botón o cualquier parte de la pantalla → sonar + entrar
            function comenzar() {
                el.cargaBtn.removeEventListener('click', comenzar);
                el.pantallaCarga.removeEventListener('click', comenzar);
                el.pantallaCarga.removeEventListener('touchstart', comenzar);
                
                activarAudio();
                // Sonar fanfarria inmediatamente (garantizado porque hubo interacción)
                fanfarriaYaSonó = true;
                if (AC) {
                    try {
                        if (AC.state === 'suspended') AC.resume();
                        setTimeout(_fanfarriaInterna, 30);
                    } catch(e) {}
                }
                vibrar([15, 30, 15]);
                
                // Pequeña pausa para que se escuche el inicio de la fanfarria
                setTimeout(entrarApp, 180);
            }
            
            el.cargaBtn.addEventListener('click', comenzar);
            el.pantallaCarga.addEventListener('click', comenzar);
            el.pantallaCarga.addEventListener('touchstart', comenzar, { passive: true });
        }

        function entrarApp() {
            el.pantallaCarga.classList.add('oculta');
            el.principal.style.opacity = '1';
            render();
            
            setTimeout(function() {
                if (!esStandalone() && !getStorageFlag('installCerrada')) {
                    el.installPrompt.classList.add('mostrar');
                }
            }, 700);
        }

        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciarApp);
        } else {
            iniciarApp();
        }

    })();
    </script>
</body>
</html>
